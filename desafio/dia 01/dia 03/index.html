<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Texto mudando de cor ao entrar em outra area.">
    <meta name="author" content="Milena Carecho">
    <title>Texto mudando de cor</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <main class="challenge" aria-label="Texto animado mudando de cor">
        <div class="intro">
            <p>CSS Animation</p>
            <h1>Texto mudando de cor</h1>
        </div>

        <section class="stage" aria-label="Faixa com texto em movimento">
            <div class="track">
                <span>DESAFIO 30 DIAS DE CSS</span>
                <span>EFEITO DE COR</span>
                <span>TEXTO EM MOVIMENTO</span>
                <span>DESAFIO 30 DIAS DE CSS</span>
            </div>

            <div class="color-panel" aria-hidden="true">
                <div class="track">
                    <span>DESAFIO 30 DIAS DE CSS</span>
                    <span>EFEITO DE COR</span>
                    <span>TEXTO EM MOVIMENTO</span>
                    <span>DESAFIO 30 DIAS DE CSS</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
