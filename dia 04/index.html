<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="description" content="Botao com efeito de borda animada no hover.">
    <meta name="author" content="Milena Carecho">
    <title>Botao com efeito hover</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <main class="page" aria-label="Botao com borda animada">

            <p class="tag">CSS Hover</p>

            <p class="description">
                Uma interface minimalista para destacar um botao com movimento suave, contraste forte e acabamento moderno.

        <section class="preview" aria-label="Area de demonstracao do botao">
            <div class="preview-header" aria-hidden="true">
